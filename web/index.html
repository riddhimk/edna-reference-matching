<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eDNA-TaxAI Results</title>
<style>
/* ------------------------------------------------------------------
   Design tokens. Colours are the validated data-viz reference palette;
   dark values are selected steps for the dark surface, not a flip.
------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --plane:        #f9f9f7;
  --surface:      #fcfcfb;
  --surface-2:    #f2f2ef;
  --ink:          #0b0b0b;
  --ink-2:        #52514e;
  --ink-muted:    #898781;
  --grid:         #e1e0d9;
  --axis:         #c3c2b7;
  --border:       rgba(11,11,11,0.10);
  --shadow:       0 1px 2px rgba(11,11,11,.04), 0 8px 24px rgba(11,11,11,.06);

  --s1: #2a78d6;  --s2: #eb6834;  --s3: #1baf7a;  --s4: #eda100;
  --s5: #e87ba4;  --s6: #008300;  --s7: #4a3aa7;  --s8: #e34948;

  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-ink: #006300;

  --seq-100:#cde2fb; --seq-250:#86b6ef; --seq-400:#3987e5; --seq-550:#1c5cab;

  --radius: 12px;
  --radius-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane:      #0d0d0d;
    --surface:    #1a1a19;
    --surface-2:  #232322;
    --ink:        #ffffff;
    --ink-2:      #c3c2b7;
    --ink-muted:  #898781;
    --grid:       #2c2c2a;
    --axis:       #383835;
    --border:     rgba(255,255,255,0.10);
    --shadow:     0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --good-ink: #0ca30c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:      #0d0d0d;
  --surface:    #1a1a19;
  --surface-2:  #232322;
  --ink:        #ffffff;
  --ink-2:      #c3c2b7;
  --ink-muted:  #898781;
  --grid:       #2c2c2a;
  --axis:       #383835;
  --border:     rgba(255,255,255,0.10);
  --shadow:     0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good-ink: #0ca30c;
}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  background: var(--plane);
  color: var(--ink);
  font: 400 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--s1); }

/* ---------------- layout ---------------- */
.shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 248px; flex: 0 0 248px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 20px 14px;
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 4px;
  overflow-y: auto;
}
.brand { padding: 4px 10px 18px; }
.brand h1 { font-size: 16px; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 3px 0 0; font-size: 12px; color: var(--ink-muted); }

.navlink {
  display:flex; align-items:center; gap:10px;
  padding: 9px 12px; border-radius: var(--radius-sm);
  color: var(--ink-2); text-decoration:none; font-size: 14px;
  border: 1px solid transparent; cursor: pointer;
  background: none; width: 100%; text-align: left; font-family: inherit;
}
.navlink:hover { background: var(--surface-2); color: var(--ink); }
.navlink.active { background: var(--surface-2); color: var(--ink); font-weight: 600; border-color: var(--border); }
.navlink .dot { width:7px; height:7px; border-radius:50%; background: currentColor; opacity:.55; flex:0 0 7px; }
.navlink.active .dot { opacity:1; background: var(--s1); }

.sidebar-foot { margin-top:auto; padding: 12px 10px 0; border-top: 1px solid var(--border); }

.main { flex: 1 1 auto; min-width: 0; }
.topbar {
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding: 16px 28px; border-bottom: 1px solid var(--border);
  background: var(--surface); position: sticky; top:0; z-index: 5;
}
.topbar h2 { margin:0; font-size: 19px; letter-spacing:-.015em; }
.topbar .sub { font-size: 13px; color: var(--ink-muted); margin-top:2px; }
.content { padding: 24px 28px 64px; max-width: 1280px; }

/* ---------------- primitives ---------------- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow);
}
.card + .card { margin-top: 18px; }
.card h3 { margin: 0 0 2px; font-size: 15px; letter-spacing:-.01em; }
.card .hint { margin: 0 0 16px; font-size: 12.5px; color: var(--ink-muted); }

.grid { display:grid; gap: 16px; }
.grid.k2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.grid.k3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.grid.k4 { grid-template-columns: repeat(4, minmax(0,1fr)); }

.tile { background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.tile .label { font-size: 12px; color: var(--ink-muted); text-transform: uppercase; letter-spacing:.055em; font-weight:600; }
.tile .value { font-size: 30px; font-weight: 650; letter-spacing:-.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.tile .foot { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }

.pill { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
        padding: 3px 9px; border-radius: 999px; border:1px solid var(--border); background: var(--surface-2); color: var(--ink-2); }
.pill.good { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 35%, transparent); }
.pill.warn { color: var(--serious); border-color: color-mix(in srgb, var(--serious) 40%, transparent); }

table { width:100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; font-variant-numeric: normal; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing:.05em; color: var(--ink-muted); font-weight: 650; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: none; }
td.mono, th.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }

.legend { display:flex; flex-wrap:wrap; gap: 14px; margin: 0 0 12px; }
.legend span { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color: var(--ink-2); }
.legend i { width:11px; height:11px; border-radius:3px; display:inline-block; }

select, input[type="search"], input[type="number"] {
  font: inherit; font-size: 13.5px; padding: 7px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); color: var(--ink);
}
.filters { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom: 16px; }
.filters label { font-size: 12px; color: var(--ink-muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em; margin-right:-4px; }

button.btn {
  font: inherit; font-size: 13.5px; padding: 7px 13px; border-radius: var(--radius-sm);
  border:1px solid var(--border); background: var(--surface); color: var(--ink); cursor:pointer;
}
button.btn:hover { background: var(--surface-2); }
button.btn:disabled { opacity:.45; cursor:not-allowed; }

.callout { border-left: 3px solid var(--s1); background: var(--surface-2);
           padding: 12px 16px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: 13.5px; color: var(--ink-2); }
.callout strong { color: var(--ink); }

.skel { background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface) 37%, var(--surface-2) 63%);
        background-size: 400% 100%; animation: sh 1.3s ease infinite; border-radius: var(--radius-sm); }
@keyframes sh { 0%{background-position:100% 50%} 100%{background-position:0 50%} }

.err { border:1px solid color-mix(in srgb, var(--critical) 45%, transparent);
       background: color-mix(in srgb, var(--critical) 8%, var(--surface));
       color: var(--ink); padding: 14px 16px; border-radius: var(--radius); font-size: 13.5px; }

.tooltip {
  position: fixed; pointer-events:none; z-index: 50;
  background: var(--surface); border:1px solid var(--border); box-shadow: var(--shadow);
  border-radius: var(--radius-sm); padding: 8px 11px; font-size: 12.5px; color: var(--ink);
  transform: translate(-50%, -115%); white-space: nowrap;
}
.tooltip .t-row { display:flex; gap:10px; justify-content:space-between; }
.tooltip .t-key { color: var(--ink-muted); }
.tooltip .t-val { font-variant-numeric: tabular-nums; font-weight:600; }

.scroll-x { overflow-x: auto; }

@media (max-width: 980px) { .grid.k4 { grid-template-columns: repeat(2,minmax(0,1fr)); } .grid.k3 { grid-template-columns: repeat(2,minmax(0,1fr)); } }
@media (max-width: 860px) {
  .shell { flex-direction: column; }
  .sidebar { width:auto; flex:none; height:auto; position:static; flex-direction:row; flex-wrap:wrap; border-right:none; border-bottom:1px solid var(--border); }
  .brand { width:100%; padding-bottom:10px; }
  .sidebar-foot { display:none; }
  .navlink { width:auto; }
  .content, .topbar { padding-left:16px; padding-right:16px; }
  .grid.k2, .grid.k3, .grid.k4 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script type="text/babel" data-type="module" src="app.jsx"></script>
</body>
</html>
